<style>
:root{--bg:#fff3e0;--card:#fff;--ink:#3a2a4d;--mut:#7a6a90;--pri:#ff6b9d;--sec:#8e7cf0;--line:#f0e1f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1633;--card:#2a2147;--ink:#f6f0ff;--mut:#bcb0d8;--line:#3c3160}}
:root[data-theme="dark"]{--bg:#1d1633;--card:#2a2147;--ink:#f6f0ff;--mut:#bcb0d8;--line:#3c3160}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header b{font-size:1.15rem}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid #ffd166;border-radius:99px;padding:3px 14px 3px 5px;font-weight:900}
.coin i{width:24px;height:24px;border-radius:50%;background:#ffd166;border:3px solid #f5a623;display:inline-block}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
h2{margin:14px 0 4px}p{color:var(--mut);margin:0 0 8px}
nav{display:flex;background:var(--card);border-top:3px solid var(--line)}
nav button{flex:1;background:none;border:0;padding:13px 4px;font:inherit;font-weight:900;color:var(--mut)}
nav button.on{color:var(--pri);box-shadow:inset 0 4px 0 var(--pri)}
.btn{background:var(--pri);color:#fff;border:3px solid rgba(255,255,255,.6);border-radius:22px;padding:14px;font:inherit;font-weight:900;font-size:1.1rem;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.btn.s{background:var(--sec);width:auto;font-size:.9rem;padding:8px 14px}
input{width:100%;font:inherit;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;text-align:center;font-size:1.1rem}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 4px;text-align:center;font-size:.78rem;font-weight:800;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.item.lk .th{opacity:.45;filter:grayscale(.6)}
.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avg button{background:var(--card);border:4px solid var(--line);border-radius:20px;padding:4px}
.avg button.on{border-color:var(--pri)}
.over{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#stage{flex:1;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.bar{height:16px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6b9d);transition:width .9s linear}
#toy{transition:transform .5s cubic-bezier(.3,2,.5,1)}#toy.dn{transition:transform .06s}
.slime{width:230px;height:200px;border-radius:55% 45% 52% 48%/58% 52% 48% 42%;position:relative;box-shadow:inset -12px -16px 0 rgba(0,0,0,.1),inset 12px 14px 0 rgba(255,255,255,.4)}
.slime svg{position:absolute;inset:0;width:100%;height:100%}
.slime.sm{width:72px;height:58px;margin:0 auto;border-radius:14px;border:5px solid #e6eef7;box-shadow:inset 3px 4px 0 rgba(255,255,255,.4)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(340px,86vw)}
.pg.mini{width:72px;gap:2px;pointer-events:none}
.pg span{display:block}
.bub{display:block;aspect-ratio:1;border-radius:50%;box-shadow:inset -5px -7px 0 rgba(0,0,0,.2),inset 5px 6px 0 rgba(255,255,255,.5);transition:transform .08s}
.bub.p{transform:scale(.86);filter:brightness(.82);box-shadow:inset 6px 7px 0 rgba(0,0,0,.25),inset -3px -3px 0 rgba(255,255,255,.3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-weight:800}
.chips button.on{background:var(--sec);color:#fff;border-color:var(--sec)}
.plate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:6px solid var(--line);border-radius:36px;padding:16px;margin:8px 0}
.plate button{background:none;border:0;padding:0;transition:transform .25s,opacity .25s}
.plate button.gone{transform:scale(0) rotate(50deg);opacity:0;pointer-events:none}
.plate svg{width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#20bf6b;color:#fff;font-weight:900;padding:10px 20px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}
